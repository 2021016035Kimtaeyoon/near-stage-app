<!doctype html>

    <title>NEAR:STAGE</title>

    <!--
      ★ OG 태그는 절대 주소여야 해서 상대 경로를 쓸 수 없습니다. 배포 주소가 바뀌면
      카카오톡 공유 미리보기가 죽은 주소를 가리키므로, 빌드 시 VITE_SITE_URL 로
      주입합니다. 끝에 슬래시를 붙이지 마세요 (예: https://near-stage.pages.dev).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NEAR:STAGE" />
    <meta property="og:title" content="NEAR:STAGE — 오늘 밤, 우리 동네 무대" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="%VITE_SITE_URL%/#/landing" />

    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />
